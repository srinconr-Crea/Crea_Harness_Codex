[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-local-harness"
version = "0.1.0"
description = "Diagnóstico y preview local para repositorios cliente de Codex"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "jsonschema>=4,<5"]

[project.scripts]
harness = "harness_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_core = ["schemas/*.json"]
harness_local = ["compatibility.json", "templates/*.md", "openspec_kit/manifest.json", "openspec_kit/LICENSE", "openspec_kit/openspec/*.yaml", "openspec_kit/.agents/skills/*/SKILL.md", "quality_kit/**/*", "quality_kit/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
